# fly.toml app configuration file generated for grimesgolf-relay on 2026-11-04T18:09:23-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grimesgolf-relay'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  Relay__TrustFlyClientIp = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
